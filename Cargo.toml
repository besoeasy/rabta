[package]
name = "rabta"
version = "0.0.1-dev"
edition = "2024"
description = "rabta node — events + blobs on one port, Rust"

[dependencies]
axum = { version = "0.8" }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = "0.1"
futures-util = "0.3"
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = "2"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
libc = "0.2"

[dev-dependencies]
rand = "0.8"

[profile.release]
opt-level = 2
strip = true
