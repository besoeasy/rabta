










<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rabta</title>
<meta name="description" content="Rabta — The self-healing sync relay for local-first apps and peer meshes.">
<meta name="application-name" content="Rabta">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta property="og:title" content="Rabta">
<meta property="og:description" content="The self-healing sync relay for local-first apps and peer meshes.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Rabta">
<meta name="twitter:description" content="The self-healing sync relay for local-first apps and peer meshes.">
<style>
  :root {
    --ink: #000;
    --mid: #6b6b6b;
    --soft: #c8c8c8;
    --rule: #e2e2e2;
    --paper: #fff;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--paper); }
  body {
    min-height: 100vh;
    background: transparent;
    color: var(--ink);
    font: 16px/1.4 var(--sans);
    -webkit-font-smoothing: antialiased;
    padding: 2.5rem 1.25rem;
    display: grid;
    place-items: center;
  }
  .page {
    width: 100%; max-width: 880px; position: relative; z-index: 1;
    background: rgba(255,255,255,0.93);
    padding: 1.5rem 1.25rem; border-radius: 0.5rem;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    pointer-events: none;
  }
  @media (min-width: 720px) { .page { padding: 2rem 2rem; } }
  .page a, .page button, .page input, .page label, .page select, .page textarea, .page code, .page .board-ui { pointer-events: auto; }
  .num { font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  a { color: inherit; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  a:hover { text-decoration-thickness: 2px; }
  a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  [hidden] { display: none !important; }

  /* header */
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
  .brand { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.03em; }
  .links { display: flex; gap: 1.1rem; font-size: 0.95rem; color: var(--mid); }
  .links a { color: var(--ink); }
  .node-id { margin-top: 0.6rem; padding: 0.6rem 0; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--rule); display: flex; gap: 1rem; align-items: baseline; font-size: 0.85rem; }
  .node-id span { color: var(--mid); flex: none; }
  .node-id code { font: 0.85rem var(--mono); overflow-wrap: anywhere; }

  /* donate footer */
  .donate { margin-top: 4rem; padding-top: 1.1rem; border-top: 1px solid var(--rule); display: flex; align-items: baseline; justify-content: center; gap: 0.6rem; flex-wrap: wrap; font-size: 0.85rem; color: var(--mid); }
  .donate code { font: 0.85rem var(--mono); color: var(--ink); overflow-wrap: anywhere; }
  .donate button { font: inherit; color: var(--ink); background: none; border: 1px solid var(--rule); border-radius: 999px; padding: 0.15rem 0.7rem; cursor: pointer; }
  .donate button:hover { border-color: var(--ink); }
  .donate button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  section { margin-top: 3rem; }
  h2 { font-size: 0.95rem; font-weight: 700; margin-bottom: 1rem; }

  /* storage */
  .storage-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .storage-used { font-size: clamp(2.8rem, 9vw, 4.5rem); font-weight: 700; line-height: 1; letter-spacing: -0.05em; }
  .storage-budget { font-size: 1.1rem; color: var(--mid); }
  .bar { display: flex; height: 36px; margin-top: 1.25rem; border: 1.5px solid var(--ink); background: var(--paper); }
  .bar > i { display: block; height: 100%; transition: width 0.6s ease; }
  .c-events { background: var(--ink); }
  .c-claimed { background: var(--mid); }
  .c-unclaimed { background: var(--soft); }
  .bar-scale { display: flex; justify-content: space-between; margin-top: 0.4rem; font-size: 0.8rem; color: var(--mid); }

  dl.legend { margin-top: 1.5rem; border-top: 1px solid var(--ink); }
  .legend div { display: grid; grid-template-columns: 1fr auto 4.5rem; gap: 1rem; align-items: center; padding: 0.65rem 0; border-bottom: 1px solid var(--rule); }
  .legend dt { display: flex; align-items: center; gap: 0.7rem; }
  .sw { width: 12px; height: 12px; border: 1px solid var(--ink); }
  .legend dd { font-variant-numeric: tabular-nums; text-align: right; }
  .legend dd.pct { color: var(--mid); }

  /* stats */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); }
  .stat { padding: 1rem 1rem 1.1rem 0; }
  .stat + .stat { padding-left: 1.25rem; border-left: 1px solid var(--rule); }
  .stat span { display: block; font-size: 0.85rem; color: var(--mid); }
  .stat b { display: block; margin-top: 0.35rem; font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 700; line-height: 1.05; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }

  /* two-column: battery + eviction */
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; }
  .pair section { margin-top: 0; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
  .big { font-size: 2.6rem; font-weight: 700; line-height: 1; letter-spacing: -0.05em; }
  .tag { font-size: 0.8rem; font-weight: 600; border: 1px solid var(--ink); border-radius: 999px; padding: 1px 10px; white-space: nowrap; }
  .tag.on { background: var(--ink); color: var(--paper); }
  .meter { height: 14px; margin-top: 1rem; border: 1.5px solid var(--ink); }
  .meter > i { display: block; height: 100%; width: 0; background: var(--ink); transition: width 0.6s ease; }
  .meta { display: flex; justify-content: space-between; gap: 1rem; margin-top: 0.5rem; font-size: 0.85rem; color: var(--mid); font-variant-numeric: tabular-nums; }
  .kv { margin-top: 1rem; border-top: 1px solid var(--ink); }
  .kv div { display: flex; justify-content: space-between; gap: 1rem; padding: 0.6rem 0; border-bottom: 1px solid var(--rule); font-variant-numeric: tabular-nums; }
  .kv dt { color: var(--mid); }

  /* sync nodes */
  .node { display: grid; grid-template-columns: 10px minmax(0, 1fr) 120px 3.5rem; gap: 1rem; align-items: center; padding: 0.8rem 0; border-bottom: 1px solid var(--rule); }
  .nodes-list { border-top: 1px solid var(--ink); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ink); border: 1.5px solid var(--ink); }
  .dot.bad { background: var(--paper); }
  .host { font-family: var(--mono); font-size: 0.95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .when { display: block; font-size: 0.8rem; color: var(--mid); }
  .node .meter { margin: 0; height: 10px; }
  .pc { text-align: right; font-variant-numeric: tabular-nums; }

  /* pulse */
  @keyframes ring { 0% { transform: scale(0.6); opacity: 0.7; } 70%, 100% { transform: scale(2.4); opacity: 0; } }
  @keyframes core { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.8); opacity: 0.5; } }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.72; } }
  @keyframes tagpulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(0,0,0,0.45); } 70% { box-shadow: 0 0 0 7px rgba(0,0,0,0); } }

  .brand { display: inline-flex; align-items: center; gap: 0.6rem; }
  .live-dot { position: relative; width: 8px; height: 8px; border-radius: 50%; background: var(--ink); animation: core 2.4s ease-in-out infinite; }
  .live-dot::after { content: ""; position: absolute; inset: 0; border: 1.5px solid var(--ink); border-radius: 50%; animation: ring 2.4s cubic-bezier(0.22, 0.61, 0.36, 1) infinite; }
  .dot { position: relative; }
  .dot.live::after { content: ""; position: absolute; inset: -1.5px; border: 1.5px solid var(--ink); border-radius: 50%; animation: ring 2.4s cubic-bezier(0.22, 0.61, 0.36, 1) infinite; }
  #bat-ring { animation: breathe 3s ease-in-out infinite; }
  #ev-state.on { animation: tagpulse 1.6s ease-out infinite; }

  /* svg graphics */
  .ico { width: 15px; height: 15px; margin-right: 0.5rem; vertical-align: -2px; fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
  .stat:hover .ico { transform: scale(1.3) rotate(-8deg); }
  .bat { display: flex; align-items: center; gap: 1.25rem; }
  .bat-info { flex: 1; min-width: 0; }
  .bat .meta { margin-top: 0.6rem; }
  .ring { width: 96px; height: 96px; flex: none; overflow: visible; }
  .ring-bg { fill: none; stroke: var(--rule); stroke-width: 8; }
  .ring-fg { fill: none; stroke: var(--ink); stroke-width: 8; stroke-dasharray: 263.9; stroke-dashoffset: 263.9; transition: stroke-dashoffset 0.9s cubic-bezier(0.16, 1, 0.3, 1); }
  .bolt, .blk { fill: var(--ink); }
  .blk.out { fill: var(--paper); stroke: var(--ink); stroke-width: 3; animation: drift 2.8s ease-in-out infinite; }
  .bat:hover .bolt { animation: core 0.8s ease-in-out infinite; }
  @keyframes drift { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }

  /* hover */
  a, .stat b, .legend div, .node, .host, .dot, .sw, .tag, .bar > i { transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s, box-shadow 0.25s, padding 0.25s; }
  .links a { position: relative; text-decoration: none; }
  .links a::after { content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: 1.5px; background: var(--ink); transform: scaleX(0); transform-origin: left; transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
  .links a:hover::after, .links a:focus-visible::after { transform: scaleX(1); }
  .stat:hover b { transform: translateY(-4px); }
  .legend div:hover { box-shadow: inset 3px 0 0 var(--ink); padding-left: 0.85rem; }
  .legend div:hover .sw { transform: scale(1.35); }
  .bar:hover > i { opacity: 0.4; }
  .bar > i:hover { opacity: 1; }
  .node:hover { box-shadow: inset 3px 0 0 var(--ink); }
  .node:hover .host { transform: translateX(6px); }
  .node:hover .dot { transform: scale(1.3); }
  .tag:hover { transform: translateY(-1px); }
  .big:hover { letter-spacing: -0.03em; }
  .big { transition: letter-spacing 0.3s cubic-bezier(0.16, 1, 0.3, 1); }

  /* live canvas background */
  #board {
    position: fixed; inset: 0; width: 100vw; height: 100vh;
    z-index: 0; display: block; cursor: crosshair; touch-action: none;
    background: var(--paper); pointer-events: auto;
  }
  .board-ui {
    position: fixed; left: 50%; bottom: 1rem; transform: translateX(-50%);
    z-index: 2; display: flex; align-items: center; flex-wrap: wrap; gap: 0.6rem 0.9rem;
    padding: 0.55rem 0.75rem; border: 1px solid var(--rule); border-radius: 0.8rem;
    background: rgba(255,255,255,0.94); box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    font: 0.75rem var(--mono); color: var(--mid); pointer-events: auto;
  }
  .board-picker {
    display: inline-flex; align-items: center; gap: 0.45rem;
    padding: 0.15rem 0.45rem 0.15rem 0.15rem;
    border: 1px solid var(--rule); border-radius: 0.55rem; background: var(--paper);
  }
  .board-picker:hover, .board-picker:focus-within { border-color: var(--ink); }
  .board-picker input {
    appearance: none; -webkit-appearance: none;
    width: 1.5rem; height: 1.5rem; padding: 0; border: 0; border-radius: 0.4rem;
    background: none; cursor: pointer;
  }
  .board-picker input::-webkit-color-swatch-wrapper { padding: 0; }
  .board-picker input::-webkit-color-swatch { border: 1px solid var(--rule); border-radius: 0.4rem; }
  .board-picker input::-moz-color-swatch { border: 1px solid var(--rule); border-radius: 0.4rem; }
  .board-picker-hex { font: 0.72rem var(--mono); color: var(--mid); letter-spacing: 0.04em; text-transform: uppercase; font-variant-numeric: tabular-nums; }
  .board-sizes { display: flex; gap: 0.35rem; }
  .board-size {
    display: grid; place-items: center; width: 1.6rem; height: 1.6rem;
    border: 1px solid var(--rule); border-radius: 0.45rem; background: var(--paper); cursor: pointer;
  }
  .board-size span { display: block; border-radius: 50%; background: var(--ink); }
  .board-size[data-size="4"] span { width: 3px; height: 3px; }
  .board-size[data-size="10"] span { width: 7px; height: 7px; }
  .board-size[data-size="22"] span { width: 11px; height: 11px; }
  .board-size[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
  .board-stats { white-space: nowrap; }
  .board-hint {
    position: fixed; left: 50%; top: 1rem; transform: translateX(-50%);
    z-index: 2; margin: 0; padding: 0.45rem 0.8rem; border-radius: 999px;
    background: rgba(255,255,255,0.92); border: 1px solid var(--rule);
    font: 0.75rem var(--mono); color: var(--mid); pointer-events: none;
  }

  @media (max-width: 720px) {
    .pair { grid-template-columns: 1fr; gap: 3rem; }
    .stats { grid-template-columns: 1fr; }
    .stat, .stat + .stat { padding: 0.9rem 0; border-left: 0; }
    .stat + .stat { border-top: 1px solid var(--rule); }
    .node { grid-template-columns: 10px minmax(0, 1fr) 3.5rem; }
    .node .meter { grid-column: 2 / 4; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<canvas id="board" role="img" aria-label="Collaborative canvas — drag to paint a signed stroke"></canvas>
<main class="page">

  <header>
    <span class="brand">Rabta<i class="live-dot" aria-hidden="true"></i></span>
    <nav class="links" aria-label="Links">
      <span class="num" id="version">v0.0.1</span>
      <a id="donate" hidden>Donate</a>
      <a href="https://github.com/besoeasy/rabta" target="_blank" rel="noopener noreferrer">GitHub</a>
    </nav>
  </header>
  <p class="node-id"><span>Node ID</span><code id="node-id">—</code></p>

  <section aria-label="Storage">
    <h2>Storage</h2>
    <div class="storage-head">
      <span class="storage-used num" id="used">—</span>
      <span class="storage-budget num">of <span id="budget">—</span></span>
    </div>
    <div class="bar" role="img" id="bar" aria-label="Storage usage">
      <i class="c-events" id="bar-events"></i>
      <i class="c-claimed" id="bar-claimed"></i>
      <i class="c-unclaimed" id="bar-unclaimed"></i>
    </div>
    <div class="bar-scale"><span>0</span><span>Eviction starts when full</span></div>
    <dl class="legend">
      <div><dt><i class="sw c-events"></i>Events</dt><dd id="events-bytes">—</dd><dd class="pct" id="events-pct">—</dd></div>
      <div><dt><i class="sw c-claimed"></i>Claimed blobs</dt><dd id="claimed-bytes">—</dd><dd class="pct" id="claimed-pct">—</dd></div>
      <div><dt><i class="sw c-unclaimed"></i>Unclaimed blobs</dt><dd id="unclaimed-bytes">—</dd><dd class="pct" id="unclaimed-pct">—</dd></div>
    </dl>
  </section>

  <section aria-label="Live stats">
    <div class="stats">
      <div class="stat"><span><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h8"/></svg>Live events</span><b id="events">—</b></div>
      <div class="stat"><span><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5 14 5v6l-6 3.5L2 11V5zM2 5l6 3.5L14 5M8 8.5v6"/></svg>Live blobs</span><b id="blobs">—</b></div>
      <div class="stat"><span><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2h4M14 10v4h-4M2 2l4.5 4.5M14 14l-4.5-4.5"/></svg>Max blob size</span><b id="max-blob">—</b></div>
    </div>
  </section>

  <div class="pair" style="margin-top:3rem">
    <section aria-label="Sync battery">
      <h2>Sync battery</h2>
      <div class="bat">
        <svg class="ring" viewBox="0 0 100 100" role="img" aria-label="Sync battery level">
          <circle class="ring-bg" cx="50" cy="50" r="42"/>
          <circle class="ring-fg" id="bat-ring" cx="50" cy="50" r="42" transform="rotate(-90 50 50)"/>
          <path class="bolt" d="M56 26 38 54h11l-5 20 18-30H51z"/>
        </svg>
        <div class="bat-info">
          <div class="row"><span class="big num" id="bat-pct">—</span><span class="tag" id="bat-mode">—</span></div>
          <div class="meta"><span id="bat-raw">—</span><span id="bat-regen">—</span></div>
        </div>
      </div>
    </section>

    <section aria-label="Eviction">
      <h2>Eviction</h2>
      <div class="bat">
        <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
          <rect class="blk" x="20" y="66" width="60" height="14"/>
          <rect class="blk" x="20" y="48" width="60" height="14"/>
          <rect class="blk out" x="20" y="24" width="60" height="14"/>
        </svg>
        <div class="bat-info">
          <div class="row"><span class="big num" id="ev-next">—</span><span class="tag" id="ev-state">idle</span></div>
          <div class="meta"><span>Next to go</span><span id="reaper-sweep" title="Reaper sweep status">—</span></div>
        </div>
      </div>
    </section>
  </div>

  <section id="nodes" aria-label="Sync nodes" hidden>
    <div class="row"><h2>Sync nodes</h2><span class="num" id="nodes-count" style="font-size:.9rem;color:var(--mid)"></span></div>
    <div class="nodes-list" id="node-list"></div>
  </section>

  <p class="board-hint" id="board-hint">Loading signed strokes…</p>
  <div class="board-ui" role="toolbar" aria-label="Canvas controls">
    <label class="board-picker">
      <input type="color" id="board-color" value="#3ddc97" aria-label="Stroke color">
      <span class="board-picker-hex" id="board-color-hex">3DDC97</span>
    </label>
    <div class="board-sizes" role="group" aria-label="Brush size">
      <button class="board-size" data-size="4" type="button" aria-label="Thin brush" aria-pressed="false"><span></span></button>
      <button class="board-size" data-size="10" type="button" aria-label="Medium brush" aria-pressed="true"><span></span></button>
      <button class="board-size" data-size="22" type="button" aria-label="Thick brush" aria-pressed="false"><span></span></button>
    </div>
    <span class="board-stats" id="board-stats">0 strokes · 0 painters</span>
  </div>

  <footer class="donate" id="donate-foot" hidden>
    <span>Donate BTC</span>
    <code id="donate-addr"></code>
    <button id="donate-copy" type="button">Copy</button>

<script>
  const $ = (id) => document.getElementById(id);

  const fmtBytes = (b) => {
    if (b == null) return '—';
    const u = ['B', 'KB', 'MB', 'GB', 'TB'];
    let i = 0, v = b;
    while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
    return `${i === 0 ? v : v.toFixed(1)} ${u[i]}`;
  };
  const fmtCount = (n) => {
    if (n == null) return '—';
    if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
    if (n >= 1e4) return (n / 1e3).toFixed(1) + 'K';
    return n.toLocaleString('en-US');
  };
  const fmtShare = (bytes, total) => {
    if (!total || !bytes) return '0%';
    const p = bytes / total * 100;
    return p < 0.1 ? '<0.1%' : p < 10 ? p.toFixed(1) + '%' : Math.round(p) + '%';
  };
  const clamp = (v) => Math.min(100, Math.max(0, v));
  const num = (n) => Math.round(n).toLocaleString('en-US');
  const hostOf = (u) => { try { return new URL(u).host; } catch { return u; } };
  const originOf = (u) => { try { return new URL(u).origin; } catch { return u; } };

  const syncAge = (ts) => {
    if (!ts) return 'Not synced yet';
    const s = Math.max(0, Math.floor(Date.now() / 1000) - ts);
    if (s < 5) return 'Synced just now';
    if (s < 60) return `Synced ${s}s ago`;
    if (s < 3600) return `Synced ${Math.floor(s / 60)}m ago`;
    if (s < 86400) return `Synced ${Math.floor(s / 3600)}h ago`;
    return `Synced ${Math.floor(s / 86400)}d ago`;
  };

  const sweepAge = (age) => {
    if (age == null) return 'No sweep yet';
    const s = Math.max(0, Math.floor(age));
    if (s < 5) return 'Swept just now';
    if (s < 60) return `Swept ${s}s ago`;
    if (s < 3600) return `Swept ${Math.floor(s / 60)}m ago`;
    if (s < 86400) return `Swept ${Math.floor(s / 3600)}h ago`;
    return `Swept ${Math.floor(s / 86400)}d ago`;
  };

  /* sync nodes */
  let syncConfigured = false;
  let configured = new Set();
  let lastPeers = [];

  function renderNodes(items) {
    if (items) lastPeers = items;
    const section = $('nodes');
    const list = syncConfigured && configured.size
      ? lastPeers.filter((p) => configured.has(originOf(p.url)))
      : (syncConfigured ? lastPeers : []);
    if (!list.length) { section.hidden = true; return; }
    section.hidden = false;
    $('nodes-count').textContent = `${list.length} ${list.length === 1 ? 'node' : 'nodes'}`;

    const frag = document.createDocumentFragment();
    for (const p of list) {
      const b = p.battery;
      const errored = p.last_error_at != null && (p.last_success_at == null || p.last_error_at > p.last_success_at);
      const pct = b && b.max > 0 ? clamp(b.remaining / b.max * 100) : null;

      const row = document.createElement('div');
      row.className = 'node';
      const title = [hostOf(p.url)];
      if (b && b.max > 0) title.push(`${num(b.remaining)} / ${num(b.max)}`);
      if (p.last_error) title.push(`Last error: ${p.last_error}`);
      row.title = title.join(' · ');

      const dot = document.createElement('span');
      dot.className = 'dot' + (errored ? ' bad' : ' live');

      const id = document.createElement('div');
      const host = document.createElement('span');
      host.className = 'host';
      host.textContent = hostOf(p.url);
      const when = document.createElement('span');
      when.className = 'when';
      when.textContent = errored ? `${syncAge(p.last_success_at)} · last attempt failed` : syncAge(p.last_success_at);
      id.append(host, when);

      const meter = document.createElement('div');
      meter.className = 'meter';
      const fill = document.createElement('i');
      fill.style.width = (pct ?? 0) + '%';
      meter.appendChild(fill);

      const pc = document.createElement('span');
      pc.className = 'pc';
      pc.textContent = pct == null ? '—' : Math.round(pct) + '%';

      row.append(dot, id, meter, pc);
      frag.appendChild(row);
    }
    $('node-list').replaceChildren(frag);
  }

  /* telemetry & node status */
  async function update() {
    try {
      const res = await fetch('/api/v1/node', { cache: 'no-store' });
      if (!res.ok) return;
      const s = await res.json();

      $('max-blob').textContent = fmtBytes(s.blobs?.max_single_bytes);
      $('events').textContent = fmtCount(s.events?.live);
      $('blobs').textContent = fmtCount(s.blobs?.live);
      if (s.version) $('version').textContent = 'v' + s.version;

      const used = s.storage?.used_bytes ?? 0;
      const budget = s.storage?.budget_bytes ?? 0;
      $('used').textContent = fmtBytes(used);
      $('budget').textContent = fmtBytes(budget);

      const ev = s.events?.bytes ?? 0;
      const cl = s.blobs?.claimed_bytes ?? 0;
      const un = s.blobs?.unclaimed_bytes ?? 0;
      const stored = ev + cl + un;
      // Bar is scaled to the storage budget; fall back to stored total if budget is unknown.
      const scale = budget > 0 ? Math.max(budget, stored) : stored;
      [['events', ev], ['claimed', cl], ['unclaimed', un]].forEach(([k, v]) => {
        $(k + '-bytes').textContent = fmtBytes(v);
        $(k + '-pct').textContent = fmtShare(v, stored);
        $('bar-' + k).style.width = (scale > 0 ? clamp(v / scale * 100) : 0) + '%';
      });

      // Eviction runs above the budget, removing the largest event first.
      const c = s.eviction?.candidates ?? {};
      const evicting = budget > 0 && used > budget;
      const st = $('ev-state');
      st.textContent = evicting ? 'Evicting' : 'Idle';
      st.classList.toggle('on', evicting);
      $('ev-next').textContent = (c.largest_bytes ?? 0) > 0 ? fmtBytes(c.largest_bytes) : '—';
      const sweep = $('reaper-sweep');
      if (sweep) {
        sweep.textContent = sweepAge(s.reaper?.last_sweep_age_s);
        if (s.reaper?.interval_s) {
          sweep.title = `Reaper sweep: ${sweepAge(s.reaper.last_sweep_age_s)} (interval ${Math.round(s.reaper.interval_s / 60)}m)`;
        }
      }

      renderNodes(s.peers?.items ?? []);

      const b = s.peers?.battery ?? { remaining: 1000000, max: 1000000, regen_per_sec: 30, mode: 'readwrite' };
      const pct = b.max > 0 ? clamp(b.remaining / b.max * 100) : 0;
      $('bat-pct').textContent = Math.round(pct) + '%';
      $('bat-ring').style.strokeDashoffset = 263.9 * (1 - pct / 100);
      $('bat-raw').textContent = `${num(b.remaining)} / ${num(b.max)}`;
      $('bat-regen').textContent = `+${b.regen_per_sec.toLocaleString('en-US')} per sec`;
      const mode = $('bat-mode');
      const label = String(b.mode ?? '').replace(/_/g, ' ');
      mode.textContent = label ? label.charAt(0).toUpperCase() + label.slice(1) : '—';
      mode.classList.toggle('on', b.mode === 'readwrite');
    } catch { /* keep last values */ }
  }

  async function loadNode() {
    try {
      const res = await fetch('/api/v1/node', { cache: 'no-store' });
      if (!res.ok) return;
      const n = await res.json();
      if (n.donate) {
        const d = $('donate');
        d.href = `bitcoin:${n.donate}`;
        d.title = `Donate BTC: ${n.donate}`;
        d.hidden = false;
        $('donate-addr').textContent = n.donate;
        $('donate-foot').hidden = false;
      }
      const list = Array.isArray(n.sync) ? n.sync : [];
      syncConfigured = list.length > 0;
      configured = new Set(list.map(originOf));
      renderNodes();
      if (n.node_id) {
        const el = $('node-id');
        el.textContent = n.node_id;
      }
    } catch { /* ignore */ }
  }

  $('donate-copy').addEventListener('click', async () => {
    const el = $('donate-addr');
    const btn = $('donate-copy');
    try {
      await navigator.clipboard.writeText(el.textContent);
      btn.textContent = 'Copied';
    } catch {
      // No clipboard API (insecure context): select the address to copy.
      const range = document.createRange();
      range.selectNodeContents(el);
      const sel = getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      btn.textContent = 'Select & copy';
    }
    setTimeout(() => { btn.textContent = 'Copy'; }, 1600);
  });

  /* ---------- live canvas ---------- */
  const initCanvas = () => {
    const canvasEl = $('board');
    const hint = $('board-hint');
    const statsEl = $('board-stats');
    if (!canvasEl || !hint || !statsEl) return;
    const ctx = canvasEl.getContext('2d');
    if (!ctx) return;

    const RELAY = '';
    const COLLECTION = 'canvas/draw';
    const TTL = 300; // 5 minutes
    const MAX_POINTS = 1200;
    const MAX_PAGES = 1000;
    const STORE_ID = 'rabta.canvas.identity.v1';

    const strokes = [];
    const owners = new Set();
    const seen = new Set();
    const strokeKeys = new Set();
    const pageEtags = new Map();
    const outbox = [];
    let posting = false;
    let color = '#3ddc97';
    let brush = 10;
    let active = null;
    let activePointer = null;
    let redrawQueued = false;
    let pollTimer = null;
    let pollBusy = false;
    let historyDone = false;
    let clockOffset = 0;
    let viewScale = 1, viewOx = 0, viewOy = 0;

    const now = () => Math.floor(Date.now() / 1000) + clockOffset;
    const syncClock = (res) => {
      const d = res && res.headers ? res.headers.get('date') : null;
      if (!d) return;
      const s = Math.floor(Date.parse(d) / 1000);
      if (Number.isFinite(s)) clockOffset = Math.min(86400, Math.max(-86400, s - Math.floor(Date.now() / 1000)));
    };
    const readText = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
    const writeText = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
    const bytesToHex = (bytes) => {
      let out = '';
      for (let i = 0; i < bytes.length; i++) out += bytes[i].toString(16).padStart(2, '0');
      return out;
    };
    const bytesToBase64 = (bytes) => {
      let raw = '';
      for (let i = 0; i < bytes.length; i++) raw += String.fromCharCode(bytes[i]);
      return btoa(raw);
    };
    const base64ToBytes = (value) => {
      const raw = atob(value);
      const bytes = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
      return bytes;
    };
    const canonical = (value) => {
      if (Array.isArray(value)) return '[' + value.map(canonical).join(',') + ']';
      if (value && typeof value === 'object') {
        return '{' + Object.keys(value).sort().map((key) => JSON.stringify(key) + ':' + canonical(value[key])).join(',') + '}';
      }
      return JSON.stringify(value);
    };
    const loadIdentity = () => {
      const make = (secretKey, publicKey) => {
        const publicHex = bytesToHex(publicKey);
        return { secretKey, publicKey, publicHex, owner: 'ed25519:' + publicHex };
      };
      try {
        const saved = JSON.parse(readText(STORE_ID) || 'null');
        if (saved && typeof saved.secret === 'string' && typeof saved.public === 'string') {
          const secretKey = base64ToBytes(saved.secret);
          const publicKey = base64ToBytes(saved.public);
          if (secretKey.length === 64 && publicKey.length === 32) return make(secretKey, publicKey);
        }
      } catch {}
      const pair = nacl.sign.keyPair();
      writeText(STORE_ID, JSON.stringify({ secret: bytesToBase64(pair.secretKey), public: bytesToBase64(pair.publicKey) }));
      return make(pair.secretKey, pair.publicKey);
    };

    const canSign = !!(window.nacl && (window.crypto && window.crypto.getRandomValues) && (function () { try { loadIdentity(); return true; } catch { return false; } })());
    const clampN = (value, min, max) => Math.min(max, Math.max(min, value));
    const randomHex = (len) => {
      const bytes = new Uint8Array(Math.ceil(len / 2));
      crypto.getRandomValues(bytes);
      return bytesToHex(bytes).slice(0, len);
    };

    const updateStats = () => {
      statsEl.textContent = strokes.length + ' strokes · ' + owners.size + ' painters';
    };
    const updateHint = () => {
      if (strokes.length) { hint.style.display = 'none'; return; }
      hint.style.display = 'flex';
      hint.textContent = !historyDone
        ? 'Loading signed strokes…'
        : canSign
          ? 'Drag to paint — every stroke is signed with your key.'
          : 'Signing unavailable here — watching live strokes only.';
    };

    const drawStroke = (stroke, preview) => {
      if (!stroke || !stroke.points.length) return;
      const pts = stroke.points;
      ctx.save();
      ctx.strokeStyle = stroke.color;
      ctx.fillStyle = stroke.color;
      ctx.lineWidth = stroke.width;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.globalAlpha = 0.96;
      if (preview) {
        ctx.shadowColor = stroke.color;
        ctx.shadowBlur = Math.min(22, 4 + stroke.width * 1.4);
      }
      if (pts.length === 1) {
        ctx.beginPath();
        ctx.arc(pts[0][0], pts[0][1], Math.max(stroke.width / 2, 0.7), 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.moveTo(pts[0][0], pts[0][1]);
        for (let i = 1; i < pts.length - 1; i++) {
          const mx = (pts[i][0] + pts[i + 1][0]) / 2;
          const my = (pts[i][1] + pts[i + 1][1]) / 2;
          ctx.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
        }
        ctx.lineTo(pts[pts.length - 1][0], pts[pts.length - 1][1]);
        ctx.stroke();
      }
      ctx.restore();
    };

    const pruneExpired = () => {
      const t = now();
      let changed = false;
      for (let i = strokes.length - 1; i >= 0; i--) {
        if (strokes[i].expiresAt <= t) {
          const s = strokes.splice(i, 1)[0];
          strokeKeys.delete(s.sid ? s.owner + '|' + s.sid + '|' + s.seq : 'id:' + s.id);
          changed = true;
        }
      }
      if (changed) {
        owners.clear();
        for (let i = 0; i < strokes.length; i++) owners.add(strokes[i].owner);
        updateStats();
        updateHint();
      }
      return changed;
    };

    const redraw = () => {
      pruneExpired();
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
      ctx.restore();
      for (let i = 0; i < strokes.length; i++) drawStroke(strokes[i], false);
      if (active) drawStroke(active, true);
    };
    const scheduleRedraw = () => {
      if (redrawQueued) return;
      redrawQueued = true;
      requestAnimationFrame(() => { redrawQueued = false; redraw(); });
    };

    const resize = () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      if (!w || !h) return;
      const ratio = Math.min(window.devicePixelRatio || 1, 2.5);
      const pxW = Math.max(1, Math.round(w * ratio));
      const pxH = Math.max(1, Math.round(h * ratio));
      if (canvasEl.width !== pxW || canvasEl.height !== pxH) { canvasEl.width = pxW; canvasEl.height = pxH; }
      const size = Math.max(w, h);
      viewScale = (size * ratio) / 1000;
      viewOx = (pxW - size * ratio) / 2;
      viewOy = (pxH - size * ratio) / 2;
      ctx.setTransform(viewScale, 0, 0, viewScale, viewOx, viewOy);
      redraw();
    };

    const addStroke = (stroke) => {
      if (!stroke) return false;
      const key = stroke.sid ? stroke.owner + '|' + stroke.sid + '|' + stroke.seq : 'id:' + stroke.id;
      if (strokeKeys.has(key)) return false;
      strokeKeys.add(key);
      if (stroke.id) seen.add(stroke.id);
      owners.add(stroke.owner);
      strokes.push(stroke);
      while (strokes.length > 500) strokes.shift();
      updateStats();
      updateHint();
      scheduleRedraw();
      return true;
    };

    const compareEvents = (a, b) => {
      const ta = Number(a.created_at) || 0;
      const tb = Number(b.created_at) || 0;
      if (ta !== tb) return ta - tb;
      const da = a.data || {};
      const db = b.data || {};
      if (da.sid && da.sid === db.sid) return (Number(da.seq) || 0) - (Number(db.seq) || 0);
      const ia = String(a.id || '');
      const ib = String(b.id || '');
      return ia < ib ? -1 : ia > ib ? 1 : 0;
    };

    const parseEvent = (event) => {
      if (!event || typeof event !== 'object' || typeof event.id !== 'string') return null;
      const data = event.data;
      if (!data || data.v !== 1 || typeof data.color !== 'string' || !Array.isArray(data.p)) return null;
      if (data.p.length < 2 || data.p.length > MAX_POINTS * 2 || data.p.length % 2 !== 0) return null;
      if (!/^#[0-9a-f]{6}$/i.test(data.color)) return null;
      const w = Number(data.w);
      if (!Number.isFinite(w)) return null;
      const owner = typeof event.owner === 'string' ? event.owner.toLowerCase() : '';
      if (!/^ed25519:[0-9a-f]{64}$/.test(owner)) return null;
      const points = [];
      for (let i = 0; i < data.p.length; i += 2) {
        const x = Number(data.p[i]);
        const y = Number(data.p[i + 1]);
        if (!Number.isFinite(x) || !Number.isFinite(y)) return null;
        points.push([clampN(Math.round(x), 0, 1000), clampN(Math.round(y), 0, 1000)]);
      }
      const sid = typeof data.sid === 'string' && /^[0-9a-f]{1,64}$/i.test(data.sid) ? data.sid.toLowerCase() : '';
      const seq = Number.isInteger(data.seq) && data.seq >= 0 && data.seq < 100000 ? data.seq : 0;
      const at = Number.isFinite(event.created_at) ? event.created_at : now();
      const expiresAt = Number.isFinite(event.expires_at) ? event.expires_at : at + TTL;
      return { id: event.id, owner, color: data.color.toLowerCase(), width: clampN(Math.round(w), 1, 48), points, sid, seq, at, expiresAt };
    };

    const addEvent = (event) => {
      if (!event || typeof event.id !== 'string' || seen.has(event.id)) return false;
      const stroke = parseEvent(event);
      if (!stroke) { seen.add(event.id); return false; }
      return addStroke(stroke);
    };

    const fetchPage = async (cursor) => {
      const params = new URLSearchParams({ collection: COLLECTION, limit: '100' });
      if (cursor) params.set('cursor', cursor);
      const key = cursor || '';
      const headers = {};
      const etag = pageEtags.get(key);
      if (etag) headers['If-None-Match'] = etag;
      const res = await fetch(RELAY + '/api/v1/events?' + params, { cache: 'no-store', headers });
      syncClock(res);
      const nextEtag = res.headers.get('etag');
      if (res.status === 304) {
        if (nextEtag) pageEtags.set(key, nextEtag);
        return { events: [], next_cursor: null };
      }
      if (!res.ok) {
        const body = await res.json().catch(() => null);
        throw new Error((body && (body.code || body.error)) || ('HTTP ' + res.status));
      }
      if (!cursor) pageEtags.clear();
      if (nextEtag) pageEtags.set(key, nextEtag);
      return res.json();
    };

    const loadHistory = async () => {
      const collected = [];
      let cursor = null;
      let pages = 0;
      try {
        do {
          const body = await fetchPage(cursor);
          const pageEvents = Array.isArray(body.events) ? body.events : [];
          collected.push(...pageEvents);
          cursor = body.next_cursor || null;
          pages += 1;
          const last = pageEvents[pageEvents.length - 1];
          const lastExp = last
            ? (Number.isFinite(Number(last.expires_at)) ? Number(last.expires_at) : (Number(last.created_at) || 0) + TTL)
            : 0;
          if (!cursor || pages >= MAX_PAGES || collected.length >= 1500 || (pageEvents.length > 0 && lastExp <= now())) break;
        } while (true);
        collected.sort(compareEvents);
        for (const event of collected) addEvent(event);
      } catch {}
      historyDone = true;
      updateHint();
    };

    const poll = async () => {
      clearTimeout(pollTimer);
      if (document.hidden) { pollTimer = setTimeout(poll, 5000); return; }
      if (pollBusy) { pollTimer = setTimeout(poll, 1000); return; }
      pollBusy = true;
      try {
        const collected = [];
        let cursor = null;
        let pages = 0;
        let unseen = true;
        do {
          const body = await fetchPage(cursor);
          const events = Array.isArray(body.events) ? body.events : [];
          collected.push(...events);
          unseen = events.some((event) => event && typeof event.id === 'string' && !seen.has(event.id));
          cursor = unseen ? (body.next_cursor || null) : null;
          pages += 1;
        } while (cursor && pages < 3);
        collected.sort(compareEvents);
        for (const event of collected) addEvent(event);
      } catch {}
      pollBusy = false;
      pollTimer = setTimeout(poll, 2000);
    };

    const sha256 = (data) => {
      const K = new Uint32Array([
        0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
        0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
        0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
        0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
        0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
        0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
        0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
        0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
      ]);
      const l = data.length * 8;
      const n = (((l + 64) >>> 9) << 4) + 16;
      const M = new Uint32Array(n);
      for (let i = 0; i < data.length; i++) M[i >> 2] |= data[i] << ((3 - (i & 3)) * 8);
      M[l >> 5] |= 0x80 << (24 - (l % 32));
      M[n - 1] = l;
      let h0=0x6a09e667,h1=0xbb67ae85,h2=0x3c6ef372,h3=0xa54ff53a,h4=0x510e527f,h5=0x9b05688c,h6=0x1f83d9ab,h7=0x5be0cd19;
      const W = new Uint32Array(64);
      const rotr = (x, n) => (x >>> n) | (x << (32 - n));
      for (let i = 0; i < n; i += 16) {
        for (let j = 0; j < 16; j++) W[j] = M[i + j];
        for (let j = 16; j < 64; j++) {
          const s0 = rotr(W[j-15],7) ^ rotr(W[j-15],18) ^ (W[j-15]>>>3);
          const s1 = rotr(W[j-2],17) ^ rotr(W[j-2],19) ^ (W[j-2]>>>10);
          W[j] = (W[j-16] + s0 + W[j-7] + s1) >>> 0;
        }
        let a=h0,b=h1,c=h2,d=h3,e=h4,f=h5,g=h6,h=h7;
        for (let j = 0; j < 64; j++) {
          const S1 = rotr(e,6) ^ rotr(e,11) ^ rotr(e,25);
          const ch = (e & f) ^ (~e & g);
          const t1 = (h + S1 + ch + K[j] + W[j]) >>> 0;
          const S0 = rotr(a,2) ^ rotr(a,13) ^ rotr(a,22);
          const maj = (a & b) ^ (a & c) ^ (b & c);
          const t2 = (S0 + maj) >>> 0;
          h=g; g=f; f=e; e=(d+t1)>>>0; d=c; c=b; b=a; a=(t1+t2)>>>0;
        }
        h0=(h0+a)>>>0; h1=(h1+b)>>>0; h2=(h2+c)>>>0; h3=(h3+d)>>>0; h4=(h4+e)>>>0; h5=(h5+f)>>>0; h6=(h6+g)>>>0; h7=(h7+h)>>>0;
      }
      const out = new Uint8Array(32);
      const H = [h0,h1,h2,h3,h4,h5,h6,h7];
      for (let i = 0; i < 8; i++) { out[i*4]=H[i]>>>24; out[i*4+1]=(H[i]>>>16)&255; out[i*4+2]=(H[i]>>>8)&255; out[i*4+3]=H[i]&255; }
      return out;
    };

    const buildEnvelope = async (data, createdAt) => {
      const identity = loadIdentity();
      const fields = {
        collection: COLLECTION,
        created_at: createdAt,
        expires_at: createdAt + TTL,
        owner: identity.owner,
        labels: ['stroke'],
        blobs: [],
        data
      };
      const bytes = new TextEncoder().encode(canonical(fields));
      const digest = (crypto.subtle && crypto.subtle.digest)
        ? new Uint8Array(await crypto.subtle.digest('SHA-256', bytes))
        : sha256(bytes);
      const signature = nacl.sign.detached(digest, identity.secretKey);
      return { ...fields, id: bytesToHex(digest), sig: bytesToHex(signature) };
    };

    const drain = async () => {
      if (posting) return;
      posting = true;
      while (outbox.length) {
        const item = outbox[0];
        try {
          const res = await fetch(RELAY + '/api/v1/events', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify(item.envelope)
          });
          syncClock(res);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          outbox.shift();
        } catch {
          item.attempts = (item.attempts || 0) + 1;
          if (item.attempts >= 3) outbox.shift();
          else break;
        }
      }
      posting = false;
      if (outbox.length) setTimeout(drain, 1500);
    };

    const commitStroke = async (finished) => {
      if (!finished || !finished.points.length) return;
      const at = now() - 1;
      const sid = randomHex(8);
      const chunks = [];
      for (let start = 0; start < finished.points.length;) {
        const end = Math.min(start + MAX_POINTS, finished.points.length);
        chunks.push(finished.points.slice(start, end));
        if (end >= finished.points.length) break;
        start = end - 1;
      }
      for (let seq = 0; seq < chunks.length; seq++) {
        const points = chunks[seq].map((p) => [clampN(Math.round(p[0]), 0, 1000), clampN(Math.round(p[1]), 0, 1000)]);
        addStroke({ id: 'local:' + sid + ':' + seq, owner: loadIdentity().owner, color: finished.color, width: finished.width, points, sid, seq, at });
        try {
          const envelope = await buildEnvelope({ v: 1, sid, seq, color: finished.color, w: finished.width, p: points.flat() }, at);
          outbox.push({ envelope, attempts: 0 });
          drain();
        } catch {}
      }
    };

    const canvasPoint = (event) => {
      const rect = canvasEl.getBoundingClientRect();
      const w = rect.width || window.innerWidth;
      const h = rect.height || window.innerHeight;
      const size = Math.max(w, h);
      const ox = (w - size) / 2;
      const oy = (h - size) / 2;
      const x = ((event.clientX - rect.left - ox) / size) * 1000;
      const y = ((event.clientY - rect.top - oy) / size) * 1000;
      return [clampN(x, 0, 1000), clampN(y, 0, 1000)];
    };

    canvasEl.addEventListener('pointerdown', (event) => {
      if (!canSign || active) return;
      if (event.pointerType === 'mouse' && event.button !== 0) return;
      activePointer = event.pointerId;
      try { canvasEl.setPointerCapture(event.pointerId); } catch {}
      active = { color, width: brush, points: [canvasPoint(event)] };
      scheduleRedraw();
    });
    canvasEl.addEventListener('pointermove', (event) => {
      if (!active || event.pointerId !== activePointer) return;
      const p = canvasPoint(event);
      const last = active.points[active.points.length - 1];
      const dx = p[0] - last[0];
      const dy = p[1] - last[1];
      if (dx * dx + dy * dy < 4) return;
      active.points.push(p);
      scheduleRedraw();
    });
    const finishStroke = (event) => {
      if (!active || event.pointerId !== activePointer) return;
      const finished = active;
      active = null;
      activePointer = null;
      try { canvasEl.releasePointerCapture(event.pointerId); } catch {}
      if (finished.points.length) commitStroke(finished);
      else scheduleRedraw();
    };
    canvasEl.addEventListener('pointerup', finishStroke);
    canvasEl.addEventListener('pointercancel', finishStroke);

    const picker = $('board-color');
    const hexEl = $('board-color-hex');
    if (picker) {
      picker.value = color;
      if (hexEl) hexEl.textContent = color.replace('#', '').toUpperCase();
      picker.addEventListener('input', () => {
        color = picker.value;
        if (hexEl) hexEl.textContent = color.replace('#', '').toUpperCase();
      });
    }
    document.querySelectorAll('.board-size').forEach((btn) => {
      btn.addEventListener('click', () => {
        brush = Number(btn.dataset.size) || 10;
        document.querySelectorAll('.board-size').forEach((el) => el.setAttribute('aria-pressed', el === btn ? 'true' : 'false'));
      });
    });

    const frame = $('board-frame');
    const fsBtn = $('board-fs');
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const syncFs = () => {
      if (fsBtn) fsBtn.setAttribute('aria-pressed', isFs() ? 'true' : 'false');
      requestAnimationFrame(resize);
      setTimeout(resize, 250);
    };
    if (fsBtn && frame) {
      fsBtn.addEventListener('click', () => {
        try {
          if (isFs()) {
            const exit = document.exitFullscreen || document.webkitExitFullscreen;
            if (exit) Promise.resolve(exit.call(document)).catch(() => {});
          } else {
            const req = frame.requestFullscreen || frame.webkitRequestFullscreen;
            if (req) Promise.resolve(req.call(frame)).catch(() => {});
          }
        } catch {}
      });
    }
    document.addEventListener('fullscreenchange', syncFs);
    document.addEventListener('webkitfullscreenchange', syncFs);

    resize();
    window.addEventListener('resize', resize);
    updateStats();
    updateHint();
    setInterval(() => { if (pruneExpired()) scheduleRedraw(); }, 15000);
    loadHistory().then(poll);
  };

  update();
  loadNode();
  initCanvas();
  setInterval(update, 5000);
</script>
